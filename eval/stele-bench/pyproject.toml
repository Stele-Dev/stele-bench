[project]
name = "stele-bench"
version = "0.1.0"
description = "Portable benchmark contracts and fixture validation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stele" }]
requires-python = ">=3.12"
keywords = ["agent", "benchmark", "coding-agent", "memory", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
]

[project.urls]
Homepage = "https://github.com/Stele-Dev/stele-bench"
Repository = "https://github.com/Stele-Dev/stele-bench"
Issues = "https://github.com/Stele-Dev/stele-bench/issues"

[project.scripts]
stele-bench = "stele_bench.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stele_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/test_external_provisioner.py" = ["E501"]
"scenarios/fieldnote-v1/stages/*/fieldnote.py" = ["E501"]
